<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watched</title>
<style>
  :root { --bg:#0a0a0a; --surface:#131313; --border:#2c2c2c; --fg:#f5f5f5; --muted:#a8a8a8; --subtle:#6f6f6f; --accent:#e50914; --accent-400:#ff4a55; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:"DM Sans", system-ui, -apple-system, Roboto, sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding:24px;
         background:radial-gradient(60% 40% at 50% 0%, rgba(229,9,20,.18), transparent 70%), var(--bg); }
  .card { width:100%; max-width:380px; text-align:center; padding:36px 28px; border-radius:24px;
          background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.04) 55%,rgba(255,255,255,.07));
          border:1px solid rgba(255,255,255,.14);
          box-shadow:inset 0 1px 0 rgba(255,255,255,.24), 0 10px 30px rgba(0,0,0,.35); }
  .glyph { width:64px; height:64px; margin:0 auto 22px; border-radius:50%; display:grid; place-items:center;
           background:linear-gradient(180deg,#ff606af2,#e50914e0);
           box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 6px 18px rgba(229,9,20,.35); }
  .glyph svg { width:28px; height:28px; }
  h1 { font-size:22px; font-weight:700; margin:0 0 8px; letter-spacing:-.01em; }
  p { margin:0 0 26px; color:var(--muted); font-size:15px; line-height:1.5; }
  .btn { display:inline-flex; align-items:center; gap:10px; padding:14px 30px; border-radius:9999px; border:0;
         background:#f4eef0; color:#1a1014; font:inherit; font-weight:700; font-size:13px; letter-spacing:.14em;
         text-transform:uppercase; cursor:pointer; }
  .btn:active { transform:scale(.97); }
  .brand { margin-top:28px; color:var(--subtle); font-size:12px; letter-spacing:.18em; text-transform:uppercase; }
  .brand b { color:var(--accent-400); }
</style>
</head>
<body>
  <div class="card">
    <div class="glyph">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>watched couldn&rsquo;t reach the server. Check your connection and try again.</p>
    <button class="btn" id="retry">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Retry
    </button>
    <div class="brand">watched<b>.</b>cx</div>
  </div>
  <script>
    var target = new URLSearchParams(location.search).get("u") || "https://watched.cx/home";
    if (!/^https:\/\/(www\.)?watched\.cx\//.test(target)) target = "https://watched.cx/home";
    document.getElementById("retry").addEventListener("click", function () { location.replace(target); });
  </script>
</body>
</html>
